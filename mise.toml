[tools]
bun = "1.3.8"

[tasks]
install = "bun install"
codegen = "bun run paraglide:compile"
"lint:eslint" = "bun eslint ."
"lint:prettier" = "bun prettier --check ."
"lint:check" = "bun run check"
lint = { depends = ["lint:*"] }
"fmt:prettier" = "bun prettier --write ."
fmt = { depends = ["fmt:*"] }
build = "bun run build"
test = "echo 'No tests found'"
ci = { depends = ["lint", "test", "build"] }
